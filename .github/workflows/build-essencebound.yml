name: Compile Essencebound RimWorld 1.7
on:
  workflow_dispatch:
  pull_request:
    branches: [ main, 'essencebound-v*' ]
  push:
    branches: [ main, 'essencebound-v*' ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python image dependencies
        run: python -m pip install Pillow
      - name: Generate 100 ability icons and sigils
        run: python Tools/generate_ability_icons.py
      - name: Verify data and assets
        run: |
          python Tests/test_database.py
          python Tests/test_confluence_resolution.py
          python Tests/test_codex.py
          python Tests/test_powers.py
          python Tests/test_creature_ranks.py
          python Tests/test_creature_rank_inspect.py
          python Tests/test_creature_loot.py
          python Tests/test_ability_visual_designs.py
          python Tests/test_generated_ability_art.py
      - name: Compile DLL
        run: dotnet build Source/Essencebound.Core.csproj -c Release --nologo
      - name: Ensure DLL exists
        run: test -s 1.7/Assemblies/Essencebound.Core.dll
      - name: Name this build
        id: build_name
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          echo "name=Essencebound-v${VERSION}-RW1.7-build${GITHUB_RUN_NUMBER}-attempt${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Prepare distributable
        run: |
          mkdir -p build/Essencebound
          cp -r About 1.7 LoadFolders.xml build/Essencebound/
          cd build && zip -qr "../${{ steps.build_name.outputs.name }}-mod.zip" Essencebound
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_name.outputs.name }}
          path: ${{ steps.build_name.outputs.name }}-mod.zip
